<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#F8F8F6" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0A0A0A" media="(prefers-color-scheme: dark)" />
		<title>Transformer Playground by HERE AND NOW AI</title>

		<!-- Light theme by default; apply a visitor's saved choice before the first paint. -->
		<script>
			(function () {
				var dark = false;
				try {
					dark = localStorage.getItem('te-theme') === 'dark';
				} catch (e) {}
				document.documentElement.classList.toggle('dark', dark);
				document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
			})();
		</script>

		<!-- Primary Meta Tags -->
		<meta name="title" content="Transformer Playground by HERE AND NOW AI" />
		<meta
			name="description"
			content="See how a GPT-2 transformer thinks, live in your browser: tokens, embeddings, attention (Q, K, V), the MLP and next-token probabilities. Free and open source."
		/>
		<meta name="author" content="HERE AND NOW AI" />
		<link rel="canonical" href="https://hereandnowai.github.io/transformer-playground/" />

		<!-- Open Graph -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="HERE AND NOW AI" />
		<meta property="og:url" content="https://hereandnowai.github.io/transformer-playground/" />
		<meta property="og:title" content="Transformer Playground by HERE AND NOW AI" />
		<meta
			property="og:description"
			content="See how a GPT-2 transformer thinks, live in your browser: tokens, embeddings, attention (Q, K, V), the MLP and next-token probabilities. Free and open source."
		/>
		<meta
			property="og:image"
			content="https://hereandnowai.github.io/transformer-playground/preview/og.png"
		/>

		<!-- Twitter -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:site" content="@hereandnow_ai" />
		<meta name="twitter:title" content="Transformer Playground by HERE AND NOW AI" />
		<meta
			name="twitter:description"
			content="See how a GPT-2 transformer thinks, live in your browser: tokens, embeddings, attention (Q, K, V), the MLP and next-token probabilities. Free and open source."
		/>
		<meta
			name="twitter:image"
			content="https://hereandnowai.github.io/transformer-playground/preview/og.png"
		/>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
